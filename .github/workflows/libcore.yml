# Гоппер VPN: сборка нативного ядра.
#
# Ядро — это Go-модуль libcore, который через gomobile превращается в
# libcore.aar, а тот кладётся в app/libs. На Windows это не собирается:
# нужны Go, Android NDK и форк gomobile. Здесь как раз Linux-раннер, где
# всё это ставится.
#
# Ядро не хранится в репозитории: aar весит 36 МБ и зависит от
# коммитов двух чужих репозиториев, зашитых в
# buildScript/lib/core/get_source_env.sh.

name: libcore

on:
  push:
    branches:
      - awg
      - main
    paths:
      - 'libcore/**'
      - 'buildScript/**'
      - 'app/libs/libcore.aar'
      - '.github/workflows/libcore.yml'

  schedule:
    - cron: '23 5 * * 1'

  # Именно {} и именно последним. Оба условия проверены перебором:
  # workflow_dispatch без значения (null) ломает workflow целиком, GitHub
  # создаёт запуск с нулём задач и молчит о причине; и стоящий его выше
  # остальных триггеров тоже даёт ноль задач. Рабочая комбинация —
  # как здесь: push, потом schedule, потом пустой объект в конце.
  workflow_dispatch: {}

jobs:
  libcore:
    name: Native core (libcore.aar)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go 1.25 нужен не только форку gomobile: amneziawg-go требует
      # go 1.25.0 в своём go.mod, на более старом тулчейне модуль
      # просто не соберётся.
      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
          cache: false

      # Версия NDK зашита в buildScript/init/env_ndk.sh, расхождение
      # даст «Error: NDK not found».
      #
      # Именно sdkmanager с полным путём, а не голый вызов: на раннере его
      # нет в PATH, из-за чего шаг падал. Плюс приём лицензий, без
      # него установка молча не проходит.
      #
      # Сторонний nttld/setup-ndk подошёл бы тоже, но лишняя зависимость
      # ради шага, который делает штатный sdkmanager.
      - name: Install Android NDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;25.0.8775105"
          ls -d "$ANDROID_HOME/ndk/25.0.8775105"

      # Форк gomobile собирается минутами, поэтому кэшируем его, а не
      # всю GOPATH.
      - name: Cache gomobile
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/go/bin/gomobile-matsuri
            ~/go/bin/gobind-matsuri
          key: gomobile-${{ runner.os }}-master2-${{ hashFiles('libcore/init.sh') }}

      # Кэш ядра: те же условия, что у NekoBox, — хэш скриптов сборки
      # плюс хэш отслеживаемых файлов ядра.
      # Имя в кавычках обязательно: в «Ядро: хэши» есть двоеточие с
      # пробелом, а YAML такое в простом значении не допускает.
      - name: "Ядро: хэши для кэша"
        run: |
          find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
          git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: Cache libcore.aar
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/libcore.yml', 'golang_status', 'libcore_status') }}

      - name: Скачать ресурсы (geosite, geoip)
        run: ./run init action gradle

      - name: Собрать ядро
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core

      - name: Проверка результата
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          test -f app/libs/libcore.aar || { echo "::error::libcore.aar не собран"; exit 1; }
          echo "размер aar: $(du -h app/libs/libcore.aar | cut -f1)"
          echo "библиотеки внутри:"
          unzip -l app/libs/libcore.aar | grep '\.so$'

      - name: Отчёт
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "### Ядро собрано" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          unzip -l app/libs/libcore.aar | grep '\.so$' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Выложить ядро
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
          retention-days: 30